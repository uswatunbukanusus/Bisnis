<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Finance Tracker - Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Dashboard Stats */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .val-total { color: var(--primary); }
        .val-income { color: var(--success); }
        .val-expense { color: var(--danger); }

        /* Form and History Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .section-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* History List */
        .history-list {
            list-style: none;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid transparent;
        }

        .history-item.income { border-left-color: var(--success); }
        .history-item.expense { border-left-color: var(--danger); }

        .item-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .item-info small {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .item-amount {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .amt-val { font-weight: 700; }

        .btn-delete {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Keuangan Bisnis Pro</h1>
        <p>Monitor arus kas usaha Anda secara real-time</p>
    </header>

    <div class="dashboard">
        <div class="stat-card">
            <span class="stat-label">Total Saldo</span>
            <div class="stat-value val-total" id="balance">Rp 0</div>
        </div>
        <div class="stat-card">
            <span class="stat-label">Pemasukan</span>
            <div class="stat-value val-income" id="income">Rp 0</div>
        </div>
        <div class="stat-card">
            <span class="stat-label">Pengeluaran</span>
            <div class="stat-value val-expense" id="expense">Rp 0</div>
        </div>
    </div>

    <div class="main-content">
        <div class="section-box">
            <h3 class="section-title">Tambah Transaksi</h3>
            <form id="tx-form">
                <div class="form-group">
                    <label>Nama Transaksi</label>
                    <input type="text" id="desc" placeholder="Contoh: Penjualan Produk A" required>
                </div>
                <div class="form-group">
                    <label>Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label>Tipe</label>
                    <select id="type">
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Simpan Transaksi</button>
            </form>
        </div>

        <div class="section-box">
            <h3 class="section-title">Riwayat Arus Kas</h3>
            <ul class="history-list" id="history-list">
                <!-- Data akan muncul di sini -->
            </ul>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('tx-form');
    const list = document.getElementById('history-list');
    const balanceEl = document.getElementById('balance');
    const incomeEl = document.getElementById('income');
    const expenseEl = document.getElementById('expense');

    let transactions = JSON.parse(localStorage.getItem('biz_v2_tx')) || [];

    function formatIDR(num) {
        return 'Rp ' + num.toLocaleString('id-ID');
    }

    function update() {
        list.innerHTML = '';
        let totalIncome = 0;
        let totalExpense = 0;

        // Sort by newest first
        const sortedTransactions = [...transactions].reverse();

        sortedTransactions.forEach((tx, index) => {
            // Find original index because we reversed it for display
            const originalIndex = transactions.length - 1 - index;
            
            const item = document.createElement('li');
            item.classList.add('history-item', tx.type);
            
            const sign = tx.type === 'income' ? '+' : '-';
            const colorClass = tx.type === 'income' ? 'val-income' : 'val-expense';

            item.innerHTML = `
                <div class="item-info">
                    <h4>${tx.desc}</h4>
                    <small>${new Date(tx.date).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'})}</small>
                </div>
                <div class="item-amount">
                    <span class="amt-val ${colorClass}">${sign} ${formatIDR(tx.amount)}</span>
                    <button class="btn-delete" onclick="removeTx(${originalIndex})">✕</button>
                </div>
            `;
            list.appendChild(item);

            if(tx.type === 'income') totalIncome += tx.amount;
            else totalExpense += tx.amount;
        });

        const netBalance = totalIncome - totalExpense;
        balanceEl.innerText = formatIDR(netBalance);
        incomeEl.innerText = formatIDR(totalIncome);
        expenseEl.innerText = formatIDR(totalExpense);

        localStorage.setItem('biz_v2_tx', JSON.stringify(transactions));
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const newTx = {
            desc: document.getElementById('desc').value,
            amount: parseFloat(document.getElementById('amount').value),
            type: document.getElementById('type').value,
            date: new Date().getTime()
        };
        transactions.push(newTx);
        form.reset();
        update();
    });

    function removeTx(index) {
        transactions.splice(index, 1);
        update();
    }

    update();
</script>

</body>
</html>
